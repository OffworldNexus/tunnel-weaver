name: Nightly E2E (DigitalOcean Disposable Droplet)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  nightly-e2e:
    name: DigitalOcean Staging Setup E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      BASE_DOMAIN: ${{ secrets.NIGHTLY_DOMAIN }}
      # The nightly delivers and reads real transactional email, so these are
      # required (the email-dependent steps earlier in the list still skip when
      # they are blank, but the account journey cannot).
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      WEAVER_E2E_EMAIL: ${{ secrets.WEAVER_E2E_EMAIL }}
      WEAVER_E2E_FROM: ${{ secrets.WEAVER_E2E_FROM }}
      # Skip Playwright's postinstall browser download; the explicit step below
      # installs exactly Chromium with its system dependencies, as `e2e-bdd` does.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # The tpmd rev `crates/weave/Cargo.toml` pins its client to. The agent
      # binary must speak the same protocol as the client the tunnel uses.
      TPMD_REV: 90cb2db45b3ea6bc065918f11c7e0fd23b4ce837
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::DIGITALOCEAN_TOKEN secret is not set; cannot provision disposable droplet."
            exit 1
          fi
          if [ -z "$BASE_DOMAIN" ]; then
            echo "::error::NIGHTLY_DOMAIN secret is not set; cannot configure DNS."
            exit 1
          fi
          # The account journey delivers and reads real email, so unlike the
          # email-dependent cargo tests it cannot skip when these are blank.
          missing=""
          [ -n "$RESEND_API_KEY" ] || missing="$missing RESEND_API_KEY"
          [ -n "$WEAVER_E2E_EMAIL" ] || missing="$missing WEAVER_E2E_EMAIL"
          [ -n "$WEAVER_E2E_FROM" ] || missing="$missing WEAVER_E2E_FROM"
          if [ -n "$missing" ]; then
            echo "::error::missing required secret(s):$missing — the nightly signs up a real account and reads its verification link through the Resend Receiving API."
            exit 1
          fi

      - name: Resolve DigitalOcean DNS zone and generate test domain
        id: domain
        run: |
          DOMAINS_JSON=$(curl -s -H "Authorization: Bearer $DO_TOKEN" "https://api.digitalocean.com/v2/domains")
          ZONE=$(echo "$DOMAINS_JSON" | jq -r --arg d "$BASE_DOMAIN" '.domains[].name as $z | select($d == $z or ($d | endswith("." + $z))) | $z' | head -n 1)
          if [ -z "$ZONE" ]; then
            echo "::error::No matching DigitalOcean DNS zone found for $BASE_DOMAIN"
            exit 1
          fi
          echo "zone=$ZONE" >> "$GITHUB_OUTPUT"

          RUN_HEX=$(openssl rand -hex 4)

          # Two names under the operator's domain:
          #   admin  A/AAAA -> droplet  (relay's own hostname; HTTP-01 cert)
          #   tunnel NS admin           (delegated zone; DNS-01 wildcard)
          if [ "$BASE_DOMAIN" = "$ZONE" ]; then
            SUB_SUFFIX=""
          else
            SUB_SUFFIX=".${BASE_DOMAIN%."$ZONE"}"
          fi
          ADMIN_DOMAIN="a${RUN_HEX}${SUB_SUFFIX}.${ZONE}"
          TUNNEL_DOMAIN="t${RUN_HEX}${SUB_SUFFIX}.${ZONE}"
          ADMIN_REC="a${RUN_HEX}${SUB_SUFFIX}"
          TUNNEL_REC="t${RUN_HEX}${SUB_SUFFIX}"

          echo "admin_domain=$ADMIN_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "tunnel_domain=$TUNNEL_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "admin_rec=$ADMIN_REC" >> "$GITHUB_OUTPUT"
          echo "tunnel_rec=$TUNNEL_REC" >> "$GITHUB_OUTPUT"
          # `full_domain` is the tunnel domain; the relay's admin host is the
          # name a paired client dials, and the tunnel is served under this.
          echo "full_domain=$TUNNEL_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The server embeds the account SPA at compile time, and
      # `weaver-assets/build.rs` refuses to build without it, so the SPA must be
      # built before any `cargo build` that compiles `weaver-server`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Build the account SPA
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      # The nightly drives the real sign-up, verification and pairing pages in a
      # browser, so it installs the same Playwright the `e2e-bdd` job does.
      - name: Install the e2e dependencies and Chromium
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # `weave` is built plainly: the nightly pairs a real device key held by
      # tpmd, exactly as a production client does.
      - name: Build release binaries (weaver-server and weave)
        run: cargo build --release -p weaver-server -p weave

      # The key agent. It is consumed as a binary, pinned to the same rev as the
      # `tpmd-client` the tunnel links.
      - name: Install tpmd (the local key agent)
        run: |
          cargo install --git https://github.com/OffworldNexus/tpmd --rev "$TPMD_REV" tpmd
          tpmd --version

      # The one shortcut the runner cannot avoid: it has no TPM, so tpmd runs
      # its `dummy` software key store. It is the backend's guaranteed floor
      # (level `file`), and both the agent and `weave pair` are told a floor that
      # level can meet — no prompt, no silent weakening.
      - name: Start tpmd with the dummy backend
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          TPMD_STATE_DIR="$(mktemp -d)"
          echo "TPMD_STATE_DIR=$TPMD_STATE_DIR" >> "$GITHUB_ENV"
          # An isolated client store for every later `weave` step.
          WEAVE_DATA_DIR="$RUNNER_TEMP/weave-data"
          echo "WEAVE_DATA_DIR=$WEAVE_DATA_DIR" >> "$GITHUB_ENV"

          tpmd serve --user --backend dummy \
            --state-dir "$TPMD_STATE_DIR" \
            --min-key-security file > /tmp/tpmd.log 2>&1 &

          SOCKET="$XDG_RUNTIME_DIR/tpmd/tpmd.sock"
          for _ in $(seq 1 100); do
            [ -S "$SOCKET" ] && break
            sleep 0.2
          done
          if [ ! -S "$SOCKET" ]; then
            echo "::error::tpmd never bound $SOCKET"
            cat /tmp/tpmd.log
            exit 1
          fi
          echo "tpmd is listening on $SOCKET"
          tpmd status --socket "$SOCKET"

      # Real-provider email e2e. The test skips unless RESEND_API_KEY and
      # WEAVER_E2E_EMAIL are configured, so PRs without the secrets stay green.
      - name: Real-provider email e2e (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEAVER_E2E_EMAIL: ${{ secrets.WEAVER_E2E_EMAIL }}
          WEAVER_E2E_FROM: ${{ secrets.WEAVER_E2E_FROM }}
        run: cargo test -p weaver-server --test email_resend_e2e -- --ignored --nocapture

      # Real OTP round-trip: the two-step headless `configure` sends a code to
      # the receiving domain, we read it back through Resend's Receiving API,
      # and the second run proves it. This exercises the mandatory OTP against
      # the real provider, not just the joke send above. The Receiving API
      # needs a full-access key; the step skips when the secrets are blank so
      # PRs without them stay green.
      - name: Real-provider OTP configure e2e (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEAVER_E2E_EMAIL: ${{ secrets.WEAVER_E2E_EMAIL }}
          WEAVER_E2E_FROM: ${{ secrets.WEAVER_E2E_FROM }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$WEAVER_E2E_EMAIL" ] || [ -z "$WEAVER_E2E_FROM" ]; then
            echo "::notice::RESEND_API_KEY/WEAVER_E2E_EMAIL/WEAVER_E2E_FROM not set; skipping the OTP configure e2e."
            exit 0
          fi

          BIN=./target/release/weaver-server
          DB="$(mktemp -d)/otp-configure.db"
          COMMON=(
            configure
            --db "$DB"
            --tunnel-domain example.com
            --admin-domain relay.example.net
            --email "$WEAVER_E2E_EMAIL"
            --headless
            --email-provider resend
            --email-from "$WEAVER_E2E_FROM"
            --email-api-key "$RESEND_API_KEY"
          )

          # Snapshot already-received ids first, so a stale OTP from an earlier
          # run (same subject) cannot be mistaken for this run's code.
          BEFORE=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
            "https://api.resend.com/emails/receiving?limit=20" | jq -r '.data[].id' | tr '\n' ' ')

          # First run issues and sends the code, then exits non-zero.
          set +e
          FIRST=$("$BIN" "${COMMON[@]}" 2>&1)
          FIRST_RC=$?
          set -e
          echo "$FIRST"
          if [ "$FIRST_RC" -eq 0 ]; then
            echo "::error::first configure run should have required the OTP"
            exit 1
          fi
          echo "$FIRST" | grep -q "OTP was sent" || { echo "::error::no OTP was sent"; exit 1; }

          # Read the code back through Resend's Receiving API, accepting only an
          # email that arrived after the snapshot above.
          CODE=""
          for _ in $(seq 1 30); do
            RESP=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
              "https://api.resend.com/emails/receiving?limit=20")
            ID=$(echo "$RESP" | jq -r --arg to "$WEAVER_E2E_EMAIL" --arg before "$BEFORE" '
              ($before | split(" ")) as $seen
              | .data[]
              | select((.to | index($to)) and (.subject | test("verification code"; "i")))
              | .id as $id
              | select(($seen | index($id)) == null)
              | $id' | head -n 1)
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              TEXT=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
                "https://api.resend.com/emails/receiving/$ID" | jq -r '.text // .html // ""')
              CODE=$(printf '%s' "$TEXT" | grep -oE '[0-9]{6}' | head -n 1 || true)
              if [ -n "$CODE" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$CODE" ]; then
            echo "::error::did not receive an OTP email at $WEAVER_E2E_EMAIL"
            exit 1
          fi
          echo "received OTP email (code redacted)"

          # Second run proves the code and persists the email block.
          "$BIN" "${COMMON[@]}" --email-otp "$CODE"
          echo "OTP accepted; email configuration persisted"

      - name: Generate ephemeral SSH key pair
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_nightly
          chmod 600 ~/.ssh/id_nightly

      - name: Provision disposable Droplet
        id: droplet
        run: |
          DROPLET_NAME="weaver-nightly-${{ github.run_id }}"
          PUB_KEY=$(cat ~/.ssh/id_nightly.pub)
          USER_DATA=$(cat <<EOF
          #cloud-config
          ssh_authorized_keys:
            - $PUB_KEY
          chpasswd:
            expire: false
          runcmd:
            - chage -d $(date +%Y-%m-%d) root
            - chage -m 0 -M 99999 -I -1 -E -1 root
          EOF
          )

          # Provisioning must survive transient capacity, not just the happy
          # path: a region can turn away a create request with "Size is not
          # available in this region" for a few minutes even when the account may
          # use that size there, and the legacy basic slug and its intel/amd
          # variants draw on separate pools. So stay in the workflow's region and
          # try each slug over a few rounds before giving up.
          REGION="ams3"
          DROPLET_ID=""
          RESP=""
          for round in 1 2 3 4 5; do
            for SIZE in s-1vcpu-1gb s-1vcpu-1gb-intel s-1vcpu-1gb-amd s-1vcpu-1gb-35gb-intel; do
              echo "Attempt $round: droplet $REGION/$SIZE …"
              RESP=$(curl -s -X POST "https://api.digitalocean.com/v2/droplets" \
                -H "Authorization: Bearer $DO_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"$DROPLET_NAME\",
                  \"region\": \"$REGION\",
                  \"size\": \"$SIZE\",
                  \"image\": \"ubuntu-24-04-x64\",
                  \"user_data\": $(printf '%s' "$USER_DATA" | jq -R -s '.')
                }")
              DROPLET_ID=$(echo "$RESP" | jq -r '.droplet.id // empty')
              if [ -n "$DROPLET_ID" ]; then
                echo "Created droplet $DROPLET_ID ($REGION/$SIZE)"
                break 2
              fi
              echo "  refused: $(echo "$RESP" | jq -r '.message // .id // "unknown error"')"
            done
            sleep 15
          done
          if [ -z "$DROPLET_ID" ]; then
            echo "Failed to create droplet in $REGION after every slug and retry: $RESP"
            exit 1
          fi
          echo "droplet_id=$DROPLET_ID" >> "$GITHUB_OUTPUT"

          # Poll for active status and public IP
          echo "Waiting for droplet $DROPLET_ID to become active..."
          for i in $(seq 1 60); do
            GET_RESP=$(curl -s "https://api.digitalocean.com/v2/droplets/$DROPLET_ID" \
              -H "Authorization: Bearer $DO_TOKEN")
            STATUS=$(echo "$GET_RESP" | jq -r '.droplet.status')
            IP=$(echo "$GET_RESP" | jq -r '.droplet.networks.v4[]? | select(.type == "public") | .ip_address' | head -n 1)
            if [ "$STATUS" = "active" ] && [ -n "$IP" ]; then
              echo "Droplet is active with IP $IP"
              echo "ip=$IP" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 3
          done

      - name: Configure DNS records in DigitalOcean zone
        id: dns
        run: |
          IP="${{ steps.droplet.outputs.ip }}"
          ZONE="${{ steps.domain.outputs.zone }}"
          ADMIN_REC="${{ steps.domain.outputs.admin_rec }}"
          TUNNEL_REC="${{ steps.domain.outputs.tunnel_rec }}"
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          # Admin A record: the relay's own hostname (and the glue for the NS
          # target, since it lives in this same zone).
          RESP_A=$(curl -s -X POST "https://api.digitalocean.com/v2/domains/$ZONE/records" \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\": \"A\", \"name\": \"$ADMIN_REC\", \"data\": \"$IP\", \"ttl\": 60}")
          REC_A_ID=$(echo "$RESP_A" | jq -r '.domain_record.id // empty')

          # Delegate the tunnel zone to the admin hostname. The relay is its
          # own nameserver; there is no wildcard A record.
          RESP_NS=$(curl -s -X POST "https://api.digitalocean.com/v2/domains/$ZONE/records" \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\": \"NS\", \"name\": \"$TUNNEL_REC\", \"data\": \"$ADMIN_DOMAIN.\", \"ttl\": 60}")
          REC_NS_ID=$(echo "$RESP_NS" | jq -r '.domain_record.id // empty')

          echo "zone=$ZONE" >> "$GITHUB_OUTPUT"
          echo "rec_a_id=$REC_A_ID" >> "$GITHUB_OUTPUT"
          echo "rec_ns_id=$REC_NS_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH and DNS propagation
        run: |
          IP="${{ steps.droplet.outputs.ip }}"
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          echo "Waiting for SSH on $IP:22..."
          for i in $(seq 1 30); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_nightly root@"$IP" "uname -a" 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            sleep 3
          done

          command -v dig || sudo apt-get install -y -qq dnsutils
          # Wait on the admin name: the tunnel zone is already delegated but the
          # relay is not serving DNS yet, so it cannot resolve until setup.
          echo "Waiting for DNS propagation of $ADMIN_DOMAIN to $IP..."
          for i in $(seq 1 40); do
            RESOLVED=$(dig +short "$ADMIN_DOMAIN" @8.8.8.8 | tail -n 1)
            if [ "$RESOLVED" = "$IP" ]; then
              echo "DNS propagated successfully: $ADMIN_DOMAIN -> $IP"
              break
            fi
            sleep 3
          done
          if [ "$RESOLVED" != "$IP" ]; then
            echo "::error::Admin domain $ADMIN_DOMAIN did not resolve to $IP (got '$RESOLVED')"
            exit 1
          fi

      # Email is a hard requirement (WVR-167): the second factor is an emailed
      # code, so a relay with no working provider cannot sign anyone in and
      # `setup` refuses to install one. The provider is proven the way an
      # operator proves it — the first run mails a six-digit code to the
      # receiving mailbox and exits non-zero, the code is read back through
      # Resend's Receiving API (never from the database), and the second run
      # proves it and installs. The code is addressed to the receiving mailbox
      # because that is the one address this workflow can read.
      - name: Deploy weaver-server and run headless setup
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEAVER_E2E_EMAIL: ${{ secrets.WEAVER_E2E_EMAIL }}
          WEAVER_E2E_FROM: ${{ secrets.WEAVER_E2E_FROM }}
        run: |
          IP="${{ steps.droplet.outputs.ip }}"
          TARGET_DOMAIN="${{ steps.domain.outputs.full_domain }}"
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_nightly \
            target/release/weaver-server root@"$IP":/tmp/weaver-server

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_nightly root@"$IP" \
            "install -m 755 /tmp/weaver-server /usr/local/bin/weaver-server"

          SETUP="/usr/local/bin/weaver-server setup --headless \
            --tunnel-domain $TARGET_DOMAIN \
            --admin-domain $ADMIN_DOMAIN \
            --email $WEAVER_E2E_EMAIL \
            --acme-provider letsencrypt-staging \
            --email-provider resend \
            --email-from $WEAVER_E2E_FROM \
            --email-api-key $RESEND_API_KEY"

          # Snapshot already-received ids first, so a stale code from an earlier
          # run (same subject) cannot be mistaken for this run's.
          BEFORE=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
            "https://api.resend.com/emails/receiving?limit=20" | jq -r '.data[].id' | tr '\n' ' ')

          # First run issues the OTP and exits non-zero.
          set +e
          FIRST=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_nightly root@"$IP" "$SETUP" 2>&1)
          FIRST_RC=$?
          set -e
          echo "$FIRST"
          if [ "$FIRST_RC" -eq 0 ]; then
            echo "::error::the first setup run should have required the OTP"
            exit 1
          fi
          echo "$FIRST" | grep -q "OTP was sent" || { echo "::error::no setup OTP was sent"; exit 1; }

          # Read the code back through Resend's Receiving API, accepting only an
          # email that arrived after the snapshot above.
          OTP=""
          for _ in $(seq 1 30); do
            RESP=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
              "https://api.resend.com/emails/receiving?limit=20")
            ID=$(echo "$RESP" | jq -r --arg to "$WEAVER_E2E_EMAIL" --arg before "$BEFORE" '
              ($before | split(" ")) as $seen
              | .data[]
              | select((.to | index($to)) and (.subject | test("verification code"; "i")))
              | .id as $id
              | select(($seen | index($id)) == null)
              | $id' | head -n 1)
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              TEXT=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
                "https://api.resend.com/emails/receiving/$ID" | jq -r '.text // .html // ""')
              OTP=$(printf '%s' "$TEXT" | grep -oE '[0-9]{6}' | head -n 1 || true)
              if [ -n "$OTP" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$OTP" ]; then
            echo "::error::did not receive the setup OTP email at $WEAVER_E2E_EMAIL"
            exit 1
          fi
          echo "received the setup OTP email (code redacted)"

          # Second run proves the code and installs, so the relay is configured
          # before it ever starts.
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_nightly root@"$IP" \
            "$SETUP --email-otp $OTP"

      - name: Wait for the relay to serve the admin and tunnel hostnames
        run: |
          IP="${{ steps.droplet.outputs.ip }}"
          TARGET_DOMAIN="${{ steps.domain.outputs.full_domain }}"
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          mkdir -p /tmp/certs
          curl -s https://letsencrypt.org/certs/staging/letsencrypt-stg-root-x1.pem > /tmp/certs/staging-ca.pem
          curl -s https://letsencrypt.org/certs/staging/letsencrypt-stg-root-x2.pem >> /tmp/certs/staging-ca.pem
          curl -s https://letsencrypt.org/certs/staging/gen-y/root-ye.pem >> /tmp/certs/staging-ca.pem
          curl -s https://letsencrypt.org/certs/staging/gen-y/root-yr.pem >> /tmp/certs/staging-ca.pem

          # The relay orders its wildcard and admin certificates at startup; both
          # names must answer HTTPS before anything pairs or browses.
          for name in "$ADMIN_DOMAIN" "$TARGET_DOMAIN"; do
            echo "Waiting for https://$name/ ..."
            ok=""
            for _ in $(seq 1 60); do
              if curl -s -o /dev/null --fail --max-time 10 --cacert /tmp/certs/staging-ca.pem "https://$name/"; then
                echo "https://$name/ is serving"
                ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::https://$name/ never came up"
              ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_nightly root@"$IP" \
                "/usr/local/bin/weaver-server cert status --json" || true
              exit 1
            fi
          done

      - name: Verify issued certificate and HTTPS endpoint
        run: |
          IP="${{ steps.droplet.outputs.ip }}"
          TARGET_DOMAIN="${{ steps.domain.outputs.full_domain }}"
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          # Verify control socket cert status (tunnel wildcard + admin single).
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_nightly root@"$IP" \
            "/usr/local/bin/weaver-server cert status --json"

          curl -s -v --fail --max-time 15 --cacert /tmp/certs/staging-ca.pem "https://$TARGET_DOMAIN/" > /dev/null
          curl -s -v --fail --max-time 15 --cacert /tmp/certs/staging-ca.pem "https://$ADMIN_DOMAIN/" > /dev/null

      # The real sign-up journey in a browser: create the account, then — once
      # the emailed verification link is known — verify, set a password, sign in.
      - name: Create the account in the browser
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEAVER_E2E_EMAIL: ${{ secrets.WEAVER_E2E_EMAIL }}
        run: |
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"
          # The receiving mailbox is shared across runs, so snapshot the ids
          # already there *before* the signup mail is sent: only a message that
          # arrives after this point can belong to this run.
          BEFORE=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
            "https://api.resend.com/emails/receiving?limit=20" | jq -r '.data[].id' | tr '\n' ' ')
          echo "RESEND_VERIFY_SNAPSHOT=$BEFORE" >> "$GITHUB_ENV"
          echo "ACCOUNT_EMAIL=$WEAVER_E2E_EMAIL" >> "$GITHUB_ENV"
          echo "PROVISION_STATE=$RUNNER_TEMP/provision-state.json" >> "$GITHUB_ENV"

          (cd e2e && node nightly/provision.mjs signup \
            --base "https://$ADMIN_DOMAIN" \
            --email "$WEAVER_E2E_EMAIL" \
            --name nightly \
            --state "$RUNNER_TEMP/provision-state.json")

      - name: Verify the account by its emailed link
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEAVER_E2E_EMAIL: ${{ secrets.WEAVER_E2E_EMAIL }}
        run: |
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"
          PASSWORD="nightly-password-$(openssl rand -hex 4)"
          echo "ACCOUNT_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          # The verification link is the real one the relay mailed through
          # Resend; read it back through Resend's Receiving API, accepting only a
          # message that arrived after the pre-signup snapshot.
          LINK=""
          for _ in $(seq 1 30); do
            RESP=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
              "https://api.resend.com/emails/receiving?limit=20")
            ID=$(echo "$RESP" | jq -r --arg to "$WEAVER_E2E_EMAIL" --arg before "$RESEND_VERIFY_SNAPSHOT" '
              ($before | split(" ")) as $seen
              | .data[]
              | select((.to | index($to)) and (.subject | test("verify your email"; "i")))
              | .id as $id
              | select(($seen | index($id)) == null)
              | $id' | head -n 1)
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              TEXT=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" \
                "https://api.resend.com/emails/receiving/$ID" | jq -r '.text // .html // ""')
              LINK=$(printf '%s' "$TEXT" | grep -oE 'https://[A-Za-z0-9.:_-]+/verify\?token=[0-9a-f]+' | head -n 1 || true)
              if [ -n "$LINK" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$LINK" ]; then
            echo "::error::did not receive the account verification email at $WEAVER_E2E_EMAIL"
            exit 1
          fi
          echo "received the account verification email (link redacted)"

          (cd e2e && node nightly/provision.mjs verify \
            --base "https://$ADMIN_DOMAIN" \
            --email "$ACCOUNT_EMAIL" \
            --password "$PASSWORD" \
            --link "$LINK" \
            --state "$PROVISION_STATE")

      # The real pairing: `weave pair` provisions the key in tpmd, solves the
      # relay's proof of work, prints the approval link and waits; the browser
      # approves the machine on the relay's own page.
      - name: Pair the machine (weave pair + browser approval)
        run: |
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          ./target/release/weave pair "$ADMIN_DOMAIN" \
            --min-key-security file \
            --insecure-root-ca /tmp/certs/staging-ca.pem > /tmp/pair.log 2>&1 &
          PAIR_PID=$!

          LINK=""
          for _ in $(seq 1 60); do
            LINK=$(grep -oE 'https://[A-Za-z0-9.:_-]+/pair#handle=[0-9a-f]+' /tmp/pair.log | head -n 1)
            [ -n "$LINK" ] && break
            sleep 1
          done
          if [ -z "$LINK" ]; then
            echo "::error::weave pair never printed an approval link"
            cat /tmp/pair.log
            kill "$PAIR_PID" 2>/dev/null || true
            exit 1
          fi
          echo "captured the pairing link (handle redacted)"

          (cd e2e && node nightly/provision.mjs approve \
            --base "https://$ADMIN_DOMAIN" \
            --link "$LINK" \
            --machine laptop \
            --person nightly \
            --state "$PROVISION_STATE")

          if ! wait "$PAIR_PID"; then
            echo "::error::weave pair did not record the approval"
            cat /tmp/pair.log
            exit 1
          fi
          cat /tmp/pair.log
          grep -q "Paired as" /tmp/pair.log || { echo "::error::pairing was not confirmed"; exit 1; }

      - name: Verify tunnel registration, certificate issuance, and HTTP proxying
        run: |
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          # A trivial local origin for `weave start` to proxy to.
          mkdir -p /tmp/origin && echo "hello from origin" > /tmp/origin/hello
          (cd /tmp/origin && python3 -m http.server 18080 --bind 127.0.0.1 > /tmp/origin.log 2>&1 &)

          # The client dials the relay's admin host; the tunnel itself is served
          # under the tunnel domain. The hostname is the one the relay assigns
          # and the client prints — never assumed.
          echo "Starting weave start client against $ADMIN_DOMAIN:443..."
          ./target/release/weave start web=18080 --server "$ADMIN_DOMAIN" --insecure-root-ca /tmp/certs/staging-ca.pem > /tmp/weave.log 2>&1 &
          echo "$!" > /tmp/weave.pid

          TUNNEL_HOST=""
          for _ in $(seq 1 90); do
            TUNNEL_HOST=$(grep -oE 'https://[A-Za-z0-9.-]+/' /tmp/weave.log | head -n 1 | sed -E 's#https://##; s#/$##')
            [ -n "$TUNNEL_HOST" ] && break
            sleep 1
          done
          if [ -z "$TUNNEL_HOST" ]; then
            echo "::error::weave start never reported a registered hostname"
            cat /tmp/weave.log
            kill "$(cat /tmp/weave.pid)" 2>/dev/null || true
            exit 1
          fi
          echo "TUNNEL_HOST=$TUNNEL_HOST" >> "$GITHUB_ENV"
          echo "Tunnel successfully registered: https://$TUNNEL_HOST/"

          echo "Querying visitor endpoint on https://$TUNNEL_HOST/hello..."
          HTTP_STATUS=""
          for _ in $(seq 1 60); do
            HTTP_STATUS=$(curl -s -o /tmp/visitor.out -w "%{http_code}" --cacert /tmp/certs/staging-ca.pem "https://$TUNNEL_HOST/hello" || true)
            [ "$HTTP_STATUS" = "200" ] && break
            sleep 1
          done
          echo "Received HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Expected HTTP 200 from the proxied origin, got $HTTP_STATUS"
            cat /tmp/weave.log
            kill "$(cat /tmp/weave.pid)" 2>/dev/null || true
            exit 1
          fi
          if ! grep -q "hello from origin" /tmp/visitor.out; then
            echo "::error::visitor did not receive the origin body:"
            cat /tmp/visitor.out
            kill "$(cat /tmp/weave.pid)" 2>/dev/null || true
            exit 1
          fi

          # Edge WAF: scanner probes are refused before the tunnel.
          for probe in /.env /.git/HEAD /env /actuator/env "/%2e%2e%2f%2eenv"; do
            WAF_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --cacert /tmp/certs/staging-ca.pem "https://$TUNNEL_HOST$probe")
            if [ "$WAF_STATUS" != "403" ]; then
              echo "::error::WAF let $probe through with $WAF_STATUS"
              kill "$(cat /tmp/weave.pid)" 2>/dev/null || true
              exit 1
            fi
          done
          echo "WAF refused the scanner playbook with 403"

      # HTTP/2 conformance (RFC 7540/7541) against the public hostname,
      # with the trivial origin still behind the tunnel. h2spec is the
      # de-facto suite; there is no equivalent canonical HTTP/1.1 runner,
      # h1 is covered by the behaviour-table e2e in `tunnel_e2e.rs`.
      - name: HTTP/2 conformance (h2spec)
        id: h2spec
        continue-on-error: true
        run: |
          H2SPEC_VERSION="2.6.0"
          curl -sSL "https://github.com/summerwind/h2spec/releases/download/v${H2SPEC_VERSION}/h2spec_linux_amd64.tar.gz" | tar xz -C /tmp
          chmod +x /tmp/h2spec
          set +e
          /tmp/h2spec --host "$TUNNEL_HOST" --port 443 --tls --insecure --timeout 10 --junit-report /tmp/h2spec.xml > /tmp/h2spec.log 2>&1
          RC=$?
          set -e
          tail -n 30 /tmp/h2spec.log
          # Allow-listed cases each carry a one-line justification; anything
          # else failing fails the job.
          ci/conformance/check_h2spec.sh /tmp/h2spec.xml ci/conformance/h2spec-allowlist.txt

      # HTTP/1.1 conformance, *through* the tunnel, as a translation check.
      # Http11Probe (RFC 9110/9112 + smuggling + malformed input) is run
      # twice against the same origin: directly, and via edge → mux → weave.
      # A test that scores worse through the tunnel than against the bare
      # origin is a translation defect; tests where the edge must legitimately
      # differ (smuggling it has to refuse) are pinned in the expectations
      # file. The probe speaks plaintext only, so a small shim terminates TLS
      # on the runner and hands the raw bytes to the edge.
      - name: Set up .NET for Http11Probe
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: HTTP/1.1 translation conformance (Http11Probe)
        id: http11probe
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/MDA2AV/Http11Probe /tmp/http11probe
          (cd /tmp/http11probe && dotnet build Http11Probe.slnx -c Release -v q)
          PROBE="dotnet run --no-build -c Release --project /tmp/http11probe/src/Http11Probe.Cli --"

          # Baseline: the origin the tunnel fronts, probed directly.
          $PROBE --host 127.0.0.1 --port 18080 --timeout 8 --output /tmp/probe-origin.json > /tmp/probe-origin.log 2>&1 || true
          tail -n 3 /tmp/probe-origin.log

          # Through the tunnel. The probe cannot set Host or TLS, and the
          # edge refuses Host≠SNI (421), so a shim terminates TLS and patches
          # only the Host header, passing every other byte through verbatim.
          python3 ci/conformance/h1_shim.py 18081 "$TUNNEL_HOST" "$TUNNEL_HOST" /tmp/certs/staging-ca.pem \
            > /tmp/shim.log 2>&1 &
          sleep 1
          cat /tmp/shim.log
          $PROBE --host 127.0.0.1 --port 18081 --timeout 8 --output /tmp/probe-tunnel.json > /tmp/probe-tunnel.log 2>&1 || true
          tail -n 3 /tmp/probe-tunnel.log

          ci/conformance/check_http11probe.sh /tmp/probe-origin.json /tmp/probe-tunnel.json ci/conformance/http11probe-expectations.txt

      # WebSocket piping conformance through the tunnel: an echo origin behind
      # `weave start`, Autobahn's fuzzingclient driving the public wss://
      # endpoint. After the 101 the tunnel is a byte pipe, so the suite runs
      # §1-5/§7/§10 (framing, ping/pong, reserved bits, opcodes,
      # fragmentation, close handling, auto-fragmentation) — the endpoint
      # implementations we do not provide are not graded. See
      # `ci/conformance/autobahn-allowlist.txt` and `fuzzingclient.json`.
      - name: WebSocket conformance (Autobahn)
        id: autobahn
        continue-on-error: true
        run: |
          ADMIN_DOMAIN="${{ steps.domain.outputs.admin_domain }}"

          # Echo origin: Python `websockets`, which implements the close
          # handshake and permessage-deflate correctly (websocat's mirror
          # drops the TCP connection on Close, which Autobahn scores as
          # UNCLEAN on every case and would mask real tunnel faults).
          pip3 install -q --user 'websockets>=13'
          python3 ci/conformance/ws_echo.py 19000 > /tmp/ws-origin.log 2>&1 &
          sleep 2
          cat /tmp/ws-origin.log

          # Add the ws service on its own `weave start`, signed by the same
          # device key (the web one is still up); its hostname is read the same
          # way.
          ./target/release/weave start ws=19000 --server "$ADMIN_DOMAIN" --insecure-root-ca /tmp/certs/staging-ca.pem --quiet > /tmp/weave-ws.log 2>&1 &
          WS_WEAVE_PID=$!

          WS_HOST=""
          for _ in $(seq 1 90); do
            WS_HOST=$(grep -oE 'https://[A-Za-z0-9.-]+/' /tmp/weave-ws.log | head -n 1 | sed -E 's#https://##; s#/$##')
            [ -n "$WS_HOST" ] && break
            sleep 1
          done
          if [ -z "$WS_HOST" ]; then
            echo "::error::the ws weave start never reported a registered hostname"
            cat /tmp/weave-ws.log
            kill "$WS_WEAVE_PID" 2>/dev/null || true
            exit 1
          fi
          echo "WS_HOST=$WS_HOST" >> "$GITHUB_ENV"
          echo "WebSocket tunnel registered: https://$WS_HOST/"

          mkdir -p /tmp/autobahn/reports
          # The Autobahn image is Python 2 with an old TLS stack and no CA
          # option, so TLS is terminated on the runner by the same shim used
          # for Http11Probe: it patches only the Host header (Autobahn sends
          # `host:443`, the edge requires Host == SNI) and passes every
          # other byte through — after the 101 it is a pure pipe, so the
          # WebSocket frames Autobahn fuzzes are untouched.
          python3 ci/conformance/h1_shim.py 19080 "$WS_HOST" "$WS_HOST" /tmp/certs/staging-ca.pem \
            > /tmp/ws-shim.log 2>&1 &
          sleep 1
          cp ci/conformance/fuzzingclient.json /tmp/autobahn/fuzzingclient.json
          docker run --rm --network host \
            -v /tmp/autobahn:/config \
            -v /tmp/autobahn/reports:/reports \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingclient -s /config/fuzzingclient.json || true

          kill -INT $WS_WEAVE_PID || true
          tail -n 5 /tmp/ws-shim.log
          ci/conformance/check_autobahn.sh /tmp/autobahn/reports/clients/index.json ci/conformance/autobahn-allowlist.txt

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: |
            /tmp/tpmd.log
            /tmp/pair.log
            /tmp/weave.log
            /tmp/weave-ws.log
            /tmp/h2spec.xml
            /tmp/h2spec.log
            /tmp/probe-origin.json
            /tmp/probe-tunnel.json
            /tmp/probe-origin.log
            /tmp/probe-tunnel.log
            /tmp/shim.log
            /tmp/autobahn/reports/
            /tmp/weave-provision-failure.png
          if-no-files-found: ignore

      - name: Conformance gate
        run: |
          failed=0
          for s in h2spec:${{ steps.h2spec.outcome }} http11probe:${{ steps.http11probe.outcome }} autobahn:${{ steps.autobahn.outcome }}; do
            echo "$s"
            case "$s" in *:success) ;; *) failed=1 ;; esac
          done
          exit $failed

      - name: Tunnel teardown → 404
        run: |
          WEAVE_PID=$(cat /tmp/weave.pid)
          echo "Stopping weave client (PID $WEAVE_PID)..."
          # The WebSocket step already stopped its own `weave start` (same device
          # key). Either way the tunnel is gone, which is what the 404 check
          # below verifies, so a missing PID is fine.
          kill -INT "$WEAVE_PID" 2>/dev/null || true
          wait "$WEAVE_PID" 2>/dev/null || true

          sleep 2
          echo "Verifying 404 after tunnel termination..."
          POST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --cacert /tmp/certs/staging-ca.pem "https://$TUNNEL_HOST/hello")
          echo "Received status after teardown: $POST_STATUS"
          if [ "$POST_STATUS" != "404" ]; then
            echo "::error::Expected HTTP 404 after tunnel shutdown, got $POST_STATUS"
            exit 1
          fi

          echo "Tunnel E2E test passed successfully!"

      - name: Teardown Droplet and DNS Records
        if: always()
        run: |
          ZONE="${{ steps.dns.outputs.zone }}"

          # 1. Delete DNS records
          if [ -n "${{ steps.dns.outputs.rec_a_id }}" ] && [ -n "$ZONE" ]; then
            curl -s -X DELETE "https://api.digitalocean.com/v2/domains/$ZONE/records/${{ steps.dns.outputs.rec_a_id }}" \
              -H "Authorization: Bearer $DO_TOKEN" || true
          fi
          if [ -n "${{ steps.dns.outputs.rec_ns_id }}" ] && [ -n "$ZONE" ]; then
            curl -s -X DELETE "https://api.digitalocean.com/v2/domains/$ZONE/records/${{ steps.dns.outputs.rec_ns_id }}" \
              -H "Authorization: Bearer $DO_TOKEN" || true
          fi

          # 2. Delete Droplet
          if [ -n "${{ steps.droplet.outputs.droplet_id }}" ]; then
            echo "Deleting droplet ${{ steps.droplet.outputs.droplet_id }}..."
            curl -s -X DELETE "https://api.digitalocean.com/v2/droplets/${{ steps.droplet.outputs.droplet_id }}" \
              -H "Authorization: Bearer $DO_TOKEN" || true
          fi
