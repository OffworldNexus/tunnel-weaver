[advisories]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "CDLA-Permissive-2.0",
    "Zlib",
    # Pulled transitively by mrml's css-inline feature (cssparser, selectors).
    "MPL-2.0",
    # Pulled by lettre's builder (quoted_printable) and the mailparse dev-dep.
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
