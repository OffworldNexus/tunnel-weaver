[workspace]
resolver = "2"
members = [
    "crates/weaver-mux",
    "crates/weaver-proto",
    "crates/weaver-tokio",
    "crates/weaver-server",
    "crates/weaver-assets",
    "crates/weaver-abuse",
    "crates/weave",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Offworld Nexus Authors"]
license = "Apache-2.0"
repository = "https://github.com/OffworldNexus/tunnel-weaver"

[workspace.dependencies]
weaver-mux = { path = "crates/weaver-mux", version = "0.1.0" }
weaver-proto = { path = "crates/weaver-proto", version = "0.1.0" }
weaver-tokio = { path = "crates/weaver-tokio", version = "0.1.0" }
weaver-assets = { path = "crates/weaver-assets", version = "0.1.0" }
weaver-abuse = { path = "crates/weaver-abuse", version = "0.1.0" }

clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
ed25519-dalek = "3.0"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
rand_core = "0.10"
zstd = { version = "0.14", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
# SeaORM abstracts the SQL backend: SQLite today, PostgreSQL later by enabling
# `sqlx-postgres` and changing the connection URL, with no code changes.
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled"] }
# The raw FFI handle `SqliteConnection::lock_handle()` exposes is the
# `sqlite3` type of `libsqlite3-sys`, and sqlx does not re-export it. The pin
# must stay inside sqlx-sqlite's own `>=0.30.1, <0.38.0` range so both crates
# resolve to one `libsqlite3-sys` and one `sqlite3` type.
libsqlite3-sys = "0.37"
tokio = { version = "1.43", features = ["sync", "rt", "fs", "macros", "net", "time", "signal", "rt-multi-thread", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = { version = "0.11", default-features = false }
# ALTCHA v3 proof-of-work (WVR-136): the challenge KDF (PBKDF2/SHA-256) plus
# HMAC-SHA256 challenge signing and constant-time comparison. Same RustCrypto
# digest line as `sha2` (0.11), so the whole workspace shares one digest.
hmac = "0.13"
pbkdf2 = "0.13"
hex = "0.4"
subtle = "2.6"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
tempfile = "3"
hyper = { version = "1.6", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "client", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "rustls-platform-verifier"] }
http-body-util = "0.1"
http = "1"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# Build-time pre-compression of the embedded static assets. Build-dependency
# only: nothing is compressed at request time. gzip uses the pure Rust
# miniz_oxide backend; zstd reuses the workspace dependency the mux already has.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# MJML → responsive HTML, compiled in-process per send with CSS inlined.
mrml = { version = "6.0", default-features = false, features = ["parse", "render", "css-inline"] }
# MIME/Message building and the SMTP transport; HTTP providers are shaped by our
# own catalog over hyper, so only the builder + SMTP pieces are enabled.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# AES-256-GCM for authenticator-app secrets at rest (WVR-166), plus the
# constant-time comparison of a TOTP code. Already in the tree through
# `rustls`/`rcgen`, so pinning it here pulls in no new crate.
ring = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
# Authoritative DNS responder and setup-side explicit DNS queries. `hickory-proto`
# is sans-IO: it parses and serialises messages, and we drive the sockets
# ourselves (UDP/TCP 53 inherited via systemd socket activation).
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
base64 = "0.22"
bytes = "1"
socket2 = "0.6"
libc = "0.2"
comfy-table = "7.1"
crossterm = "0.29"
# Line-editable prompts for `weaver-server setup`. Uses the same `crossterm`
# backend as the rest of the CLI, so no second terminal crate is pulled in.
inquire = "0.9"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rustls-platform-verifier = "0.7"
# Account plane (WVR-36). An axum router is mounted inside the raw-hyper edge and
# serves only the admin host's account namespace; the rest of the edge keeps its
# existing hyper handling. Sessions/CSRF are hand-rolled inside that router so the
# `browser_session` record maps 1:1 to the Store (see `account::session`).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }
# `ServiceExt::oneshot` is how the hyper edge drives the mounted axum router.
tower = { version = "0.5", default-features = false, features = ["util"] }
# Argon2id password hashing with the PHC encoded representation. SHA-1 is used
# only for the Have I Been Pwned k-anonymity range query and — through HMAC, in
# RFC 6238 TOTP — for authenticator-app codes (WVR-166); never for storage.
argon2 = "0.6"
sha1 = "0.11"
# WebAuthn passkeys (WVR-163): the registration and assertion ceremonies, with
# the RP-ID/origin binding and the CBOR/COSE validation we must not hand-roll.
# `attestation` stays off — the policy is "accept none" — though that alone does
# *not* keep OpenSSL out: `webauthn-rs-core` parses X.509 through it whatever we
# ask for, which is why OpenSSL is vendored below.
# `conditional-ui` is what exposes the discoverable/autofill ceremony
# (`start_discoverable_authentication`), which is how the sign-in page offers a
# passkey in the email field.
webauthn-rs = { version = "0.5", default-features = false, features = ["conditional-ui"] }
# The X.509 half of `webauthn-rs` is built on OpenSSL, and depends on it
# unconditionally. Vendored, so the relay carries its own libcrypto: no target
# needs a system libssl to build or to run it, which is what lets the aarch64
# artifacts cross-compile and then execute under QEMU in CI. It lives here rather
# than in the code because it is a feature choice for a crate we never call.
openssl = { version = "0.10", features = ["vendored"] }
# The passkey feature (WVR-163) needs a *derived* per-account WebAuthn user
# handle (v5, name-based) — it comes back on every discoverable assertion, so it
# must be the same value every time and must never be random.
uuid = { version = "1.19", features = ["v5"] }
