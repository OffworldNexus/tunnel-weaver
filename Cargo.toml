[workspace]
resolver = "2"
members = [
    "crates/weaver-mux",
    "crates/weaver-proto",
    "crates/weaver-tokio",
    "crates/weaver-server",
    "crates/weaver-assets",
    "crates/weave",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Offworld Nexus Authors"]
license = "Apache-2.0"
repository = "https://github.com/OffworldNexus/tunnel-weaver"

[workspace.dependencies]
weaver-mux = { path = "crates/weaver-mux", version = "0.1.0" }
weaver-proto = { path = "crates/weaver-proto", version = "0.1.0" }
weaver-tokio = { path = "crates/weaver-tokio", version = "0.1.0" }
weaver-assets = { path = "crates/weaver-assets", version = "0.1.0" }

clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
ed25519-dalek = "3.0"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
rand_core = "0.10"
zstd = { version = "0.14", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
# SeaORM abstracts the SQL backend: SQLite today, PostgreSQL later by enabling
# `sqlx-postgres` and changing the connection URL, with no code changes.
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled"] }
tokio = { version = "1.43", features = ["sync", "rt", "fs", "macros", "net", "time", "signal", "rt-multi-thread", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = { version = "0.11", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
tempfile = "3"
hyper = { version = "1.6", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "client", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "rustls-platform-verifier"] }
http-body-util = "0.1"
http = "1"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# MJML → responsive HTML, compiled in-process per send with CSS inlined.
mrml = { version = "6.0", default-features = false, features = ["parse", "render", "css-inline"] }
# MIME/Message building and the SMTP transport; HTTP providers are shaped by our
# own catalog over hyper, so only the builder + SMTP pieces are enabled.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
# Authoritative DNS responder and setup-side explicit DNS queries. `hickory-proto`
# is sans-IO: it parses and serialises messages, and we drive the sockets
# ourselves (UDP/TCP 53 inherited via systemd socket activation).
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
base64 = "0.22"
bytes = "1"
socket2 = "0.6"
libc = "0.2"
comfy-table = "7.1"
crossterm = "0.29"
# Line-editable prompts for `weaver-server setup`. Uses the same `crossterm`
# backend as the rest of the CLI, so no second terminal crate is pulled in.
inquire = "0.9"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rustls-platform-verifier = "0.7"
