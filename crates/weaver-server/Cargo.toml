[package]
name = "weaver-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "weaver_server"
path = "src/lib.rs"

[[bench]]
name = "scanner"
harness = false

[[bench]]
name = "safety"
harness = false

[[bin]]
name = "weaver-server"
path = "src/main.rs"

[features]
## Test-only helpers (`MockClock`).
test-util = []

[dependencies]
argon2 = { workspace = true }
askama = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bird-id = { git = "https://github.com/OffworldNexus/bird-id", branch = "develop" }
bytes = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
hickory-proto = { workspace = true }
inquire = { workspace = true }
instant-acme = { workspace = true }
jiff = { workspace = true }
lettre = { workspace = true }
libc = { workspace = true }
libsqlite3-sys = { workspace = true }
mrml = { workspace = true }
openssl = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
sqlx = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { workspace = true }
weaver-abuse = { workspace = true }
weaver-assets = { workspace = true, features = ["account-spa"] }
weaver-mux = { workspace = true }
weaver-proto = { workspace = true }
weaver-tokio = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
weaver-server = { path = ".", features = ["test-util"] }
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client", "client-legacy"] }
mailparse = "0.18"
weave = { path = "../weave" }
weaver-abuse = { workspace = true, features = ["test-util"] }
weaver-mux = { workspace = true, features = ["test-util"] }
