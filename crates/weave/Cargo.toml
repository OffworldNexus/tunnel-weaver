[package]
name = "weave"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "weave"
path = "src/main.rs"

[lib]
name = "weave"
path = "src/lib.rs"

[features]
# The hard-coded development Ed25519 signer (see `src/identity.rs`). On for the
# PoC integration tests, which authenticate as the key the relay's initial
# migration seeds; off for a real build, which uses the tpmd device key.
dev-signer = []

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
jiff = { workspace = true }
async-trait = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true }
hostname = "0.4"
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
weaver-abuse = { workspace = true }
weaver-assets = { workspace = true }
weaver-mux = { workspace = true }
weaver-proto = { workspace = true }
weaver-tokio = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
sqlx = { workspace = true }
directories = "6"
# The device key is held by tpmd, the local key agent: `weave` links its
# consumer API and never holds a private key.
#
# Pinned to a rev on purpose: it serves the system socket at
# `/run/tpmd/tpmd.sock`, which is what the packaged service exposes; `develop`
# still uses the old `/run/tpmd.sock`. Move to `branch = "develop"` once the new
# path lands there.
tpmd-client = { git = "https://github.com/OffworldNexus/tpmd", rev = "90cb2db45b3ea6bc065918f11c7e0fd23b4ce837" }
# Terminal output: spinners, colour, and OSC 8 hyperlink detection.
indicatif = "0.18"
console = "0.16"
supports-hyperlinks = "3"

[dev-dependencies]
tempfile = { workspace = true }
