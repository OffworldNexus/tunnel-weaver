<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbidden - Tunnel Weaver</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --error: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.15);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --card-bg: #ffffff;
                --border: #e2e8f0;
                --text-primary: #0f172a;
                --text-secondary: #64748b;
                --error: #e11d48;
                --error-glow: rgba(225, 29, 72, 0.1);
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--error-glow);
            color: var(--error);
            border: 1px solid var(--error);
            border-radius: 9999px;
            padding: 0.35rem 0.85rem;
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--error);
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        code {
            display: inline-block;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.15rem 0.45rem;
            font-size: 0.875rem;
            color: var(--text-primary);
            word-break: break-all;
        }
        .footer {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">
            <span class="badge-dot"></span>
            403 Forbidden
        </div>
        <h1>Request Blocked</h1>
        <p>This request matched a pattern that no application behind this tunnel serves (<code>{{REASON}}</code>). It was refused at the edge and never reached the origin.</p>
        <div class="footer">
            Tunnel Weaver Edge Server
        </div>
    </div>
</body>
</html>
