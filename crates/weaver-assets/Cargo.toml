[package]
name = "weaver-assets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
## Embed the built SvelteKit account SPA. Off by default so the
## workspace builds without Node and so the `weave` client never carries SPA
## bytes; only `weaver-server` enables it.
account-spa = []

[dependencies]
askama = { workspace = true }
http = { workspace = true }

[build-dependencies]
# Pre-compress the embedded assets at build time (see build.rs).
flate2 = { workspace = true }
zstd = { workspace = true }
